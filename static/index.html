
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎵%3C/text%3E%3C/svg%3E">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101014">
<title>AirPlay Bridge | Now Playing</title>

  <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
  <div id="backdrop" class="backdrop" aria-hidden="true"></div>
  <div class="veil" aria-hidden="true"></div>

  <main id="player-shell" class="shell">
    <header>
      <div class="brand">
        AirPlay Bridge
        <span>Now Playing</span>
      </div>

      <div class="header-actions">
        <span
          id="playback"
          class="playback-status"
          role="status"
        >
          Loading...
        </span>
        <button
          id="fullscreen-button"
          class="fullscreen-button"
          type="button"
          aria-label="Enter full screen"
          title="Enter full screen"
        >⛶</button>
      </div>
    </header>

    <section class="player" aria-label="Now playing">
      <div class="artwork-wrap">
        <span class="artwork-placeholder" aria-hidden="true">
          &#9835;
        </span>

        <img
          id="artwork"
          class="artwork"
          alt="Album artwork"
        >
      </div>

      <div class="track-info">
        <div class="track-title" id="track">
          Loading...
        </div>

        <div class="artist" id="artist"></div>
        <p class="album" id="album"></p>
      </div>

      <div
        id="progress-section"
        class="progress-section"
        role="group"
        aria-label="Playback progress"
      >
        <div
          id="progress-track"
          class="progress-track"
          role="progressbar"
          aria-label="Track progress"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div id="progress-fill" class="progress-fill"></div>
        </div>

        <div class="progress-times">
          <span id="elapsed-time">0:00</span>
          <span id="total-time">0:00</span>
        </div>
      </div>

      <section id="dsp-panel" class="dsp-panel" aria-label="CamillaDSP output levels">
        <div class="dsp-heading">
          <span>Output levels <span class="dsp-unit">dBFS</span></span>
          <span id="dsp-status" role="status">DSP connecting...</span>
        </div>
        <div class="meter-scale" aria-hidden="true">
          <span>−60</span><span>−30</span><span>0</span>
        </div>
        <div class="meter-row">
          <span class="meter-channel">L</span>
          <div id="meter-left" class="level-meter" role="meter" aria-label="Left output RMS level"
               aria-valuemin="-60" aria-valuemax="0" aria-valuenow="-60">
            <div class="meter-fill"></div><div class="meter-peak"></div>
          </div>
          <span id="meter-left-value" class="meter-value">—</span>
        </div>
        <div class="meter-row">
          <span class="meter-channel">R</span>
          <div id="meter-right" class="level-meter" role="meter" aria-label="Right output RMS level"
               aria-valuemin="-60" aria-valuemax="0" aria-valuenow="-60">
            <div class="meter-fill"></div><div class="meter-peak"></div>
          </div>
          <span id="meter-right-value" class="meter-value">—</span>
        </div>
        <div class="dsp-footer">
          <span id="dsp-load">DSP load: —</span>
          <span id="dsp-clips">Clipped samples: —</span>
        </div>
      </section>

      <div class="details">
        <div class="detail">
          <span class="detail-label">DAC / Device</span>
          <span id="output-device" class="value">Checking...</span>
        </div>
        <div class="detail">
          <span class="detail-label">Duration</span>
          <span id="duration" class="value">Unknown</span>
        </div>

        <div class="detail">
          <span class="detail-label">Source</span>
          <span id="source-format" class="value">Unknown</span>
        </div>

        <div class="detail">
          <span class="detail-label">Output</span>
          <span id="output-format" class="value">Unknown</span>
        </div>
      </div>
    </section>

    <p class="footer">
      Prototype v0.11.0 | moOde AirPlay metadata | Read-only
    </p>
  </main>

  <script src="/static/player.js" defer></script>
  <script src="/static/meters.js" defer></script>
</body>
</html>
