
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101014">
  <title>Apple Music Bridge | Now Playing</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101014;
      color: #f9f7fa;
    }

    .backdrop {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  filter: blur(20px);
  transform: scale(1.2);
  opacity: 1;
  pointer-events: none;
}
.veil {
  position: fixed;
  inset: 0;
  z-index: 1;
  background: rgba(8, 8, 12, 0.45);
  pointer-events: none;
}

    .shell {
  position: relative;
  z-index: 2;
  width: min(100%, 840px);
  margin: 0 auto;
  padding: 30px 24px 55px;
}
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 34px;
    }

    .brand {
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #ff879b;
    }

    .brand span {
      display: block;
      margin-top: 6px;
      font-size: 0.72rem;
      letter-spacing: 0.09em;
      color: #c6c1ca;
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .fullscreen-button {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid #ffffff26;
      border-radius: 50%;
      background: #ffffff0c;
      color: #f9f7fa;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 1.2rem;
    }

    .fullscreen-button:hover {
      background: #ffffff24;
    }

    .fullscreen-button:focus-visible {
      outline: 2px solid #ff879b;
      outline-offset: 3px;
    }

    .playback-status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      border: 1px solid #ffffff26;
      border-radius: 100px;
      padding: 9px 14px;
      font-size: 0.8rem;
      font-weight: 650;
      background: #ffffff0c;
      color: #ddd;
    }

    .playback-status::before {
      content: "";
      height: 7px;
      width: 7px;
      border-radius: 50%;
      background: #8f8b95;
    }

    .playback-status.playing::before {
      background: #69e7a3;
      box-shadow: 0 0 12px #69e7a366;
    }

    .playback-status.paused::before {
      background: #ffd07b;
    }

    .player {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .artwork-wrap {
      width: min(100%, 420px);
      aspect-ratio: 1;
      border-radius: 14px;
      background: #ffffff0b;
      box-shadow: 0 30px 75px #0009,
                  0 0 0 1px #ffffff1a;
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    .artwork {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .artwork-placeholder {
      font-size: 3.5rem;
      opacity: 0.25;
    }

    .artwork-wrap:has(.artwork[style*="block"])
    .artwork-placeholder {
      display: none;
    }

    .track-info {
      text-align: center;
      margin: 28px 0 26px;
      width: 100%;
    }

    .track-title {
      font-size: clamp(1.65rem, 4vw, 2.3rem);
      line-height: 1.2;
      font-weight: 760;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }

    .artist {
      font-size: 1.2rem;
      margin-top: 9px;
      color: #f5d8df;
    }

    .album {
      color: #b9b2bd;
      margin: 8px 0 0;
      font-size: 0.96rem;
    }

    .progress-section {
      display: none;
      width: min(100%, 560px);
      margin: 0 auto 32px;
    }

    .progress-track {
      height: 7px;
      border-radius: 100px;
      background: #ffffff3b;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(
        90deg,
        #ff6684,
        #ff9aad
      );
    }

    .progress-times {
      display: flex;
      justify-content: space-between;
      margin-top: 11px;
      font-size: 0.83rem;
      color: #d2cbd5;
      font-variant-numeric: tabular-nums;
    }

    .details {
      width: min(100%, 560px);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      padding-top: 24px;
      border-top: 1px solid #ffffff30;
    }

    .detail {
      padding: 14px;
      border: 1px solid #ffffff19;
      background: #ffffff0b;
      border-radius: 12px;
      min-width: 0;
    }

    .detail-label {
      display: block;
      color: #b8b1bc;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .value {
      display: block;
      font-size: 0.83rem;
      font-weight: 600;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .footer {
      text-align: center;
      color: #aba4af;
      font-size: 0.75rem;
      margin: 34px 0 0;
    }

    .shell[data-state="disconnected"] .artwork-wrap,
    .shell[data-state="unavailable"] .artwork-wrap {
      opacity: 0.8;
    }

    @media (max-width: 540px) {
      .shell {
        padding: 22px 18px 40px;
      }

      header {
        margin-bottom: 28px;
      }

      .details {
        grid-template-columns: 1fr;
        gap: 9px;
      }

      .detail {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }

      .detail-label {
        margin: 0;
      }

      .value {
        text-align: right;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .backdrop {
        transition: none;
      }
    }

/* v0.7: Fit Now Playing into one screen */

@media (min-width: 541px) {
  .shell {
    min-height: 100dvh;
    padding: 12px 24px 16px;
    display: flex;
    flex-direction: column;
  }

  header {
    margin-bottom: 12px;
  }

  .player {
    flex: 1;
    justify-content: center;
  }

  .artwork-wrap {
    width: min(
      100%,
      380px,
      max(180px, calc(100dvh - 370px))
    );
    flex-shrink: 0;
  }

  .track-info {
    margin: 14px 0 14px;
  }

  .track-title {
    font-size: clamp(1.3rem, 3vw, 1.85rem);
  }

  .artist {
    font-size: 1rem;
    margin-top: 5px;
  }

  .album {
    font-size: 0.85rem;
    margin-top: 4px;
  }

  .progress-section {
    margin-bottom: 14px;
  }

  .details {
    padding-top: 12px;
  }

  .detail {
    padding: 9px 12px;
  }

  .footer {
    margin-top: 12px;
  }
}

  </style>
</head>

<body>
  <div id="backdrop" class="backdrop" aria-hidden="true"></div>
  <div class="veil" aria-hidden="true"></div>

  <main id="player-shell" class="shell">
    <header>
      <div class="brand">
        Apple Music Bridge
        <span>AirPlay | Now Playing</span>
      </div>

      <div class="header-actions">
        <span
          id="playback"
          class="playback-status"
          role="status"
        >
          Loading...
        </span>
        <button
          id="fullscreen-button"
          class="fullscreen-button"
          type="button"
          aria-label="Enter full screen"
          title="Enter full screen"
        >⛶</button>
      </div>
    </header>

    <section class="player" aria-label="Now playing">
      <div class="artwork-wrap">
        <span class="artwork-placeholder" aria-hidden="true">
          &#9835;
        </span>

        <img
          id="artwork"
          class="artwork"
          alt="Album artwork"
        >
      </div>

      <div class="track-info">
        <div class="track-title" id="track">
          Loading...
        </div>

        <div class="artist" id="artist"></div>
        <p class="album" id="album"></p>
      </div>

      <div
        id="progress-section"
        class="progress-section"
        role="group"
        aria-label="Playback progress"
      >
        <div
          id="progress-track"
          class="progress-track"
          role="progressbar"
          aria-label="Track progress"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div id="progress-fill" class="progress-fill"></div>
        </div>

        <div class="progress-times">
          <span id="elapsed-time">0:00</span>
          <span id="total-time">0:00</span>
        </div>
      </div>

      <div class="details">
        <div class="detail">
          <span class="detail-label">Duration</span>
          <span id="duration" class="value">Unknown</span>
        </div>

        <div class="detail">
          <span class="detail-label">Source</span>
          <span id="source-format" class="value">Unknown</span>
        </div>

        <div class="detail">
          <span class="detail-label">Output</span>
          <span id="output-format" class="value">Unknown</span>
        </div>
      </div>
    </section>

    <p class="footer">
      Prototype v0.9 | moOde AirPlay metadata | Read-only
    </p>
  </main>

  <script>
    function formatDuration(milliseconds) {
      const value = Number(milliseconds);

      if (!Number.isFinite(value) || value < 0) {
        return 'Unknown';
      }

      const seconds = Math.floor(value / 1000);

      return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
    }

    function setPlaybackStatus(state) {
      const playback = document.getElementById('playback');

      const labels = {
        playing: 'Playing',
        paused: 'Paused',
        disconnected: 'Disconnected',
        unavailable: 'Unavailable',
        unknown: 'Unknown'
      };

      playback.textContent = labels[state] ?? 'Unknown';

      playback.className = 'playback-status ' + (
        labels[state] ? state : 'unknown'
      );

      document.getElementById('player-shell').dataset.state = state;
    }

    let currentTrackKey = null;
    let playbackState = 'unknown';
    let progressPositionMs = null;
    let progressDurationMs = 0;
    let progressClockMs = null;
    let progressTargetMs = null;
    let updating = false;

    function clearProgress() {
      progressPositionMs = null;
      progressDurationMs = 0;
      progressClockMs = null;
      progressTargetMs = null;

      document.getElementById('progress-section').style.display =
        'none';

      document.getElementById('progress-fill').style.width = '0%';

      document.getElementById('elapsed-time').textContent = '0:00';
      document.getElementById('total-time').textContent = '0:00';

      document.getElementById('progress-track')
        .setAttribute('aria-valuenow', '0');
    }

    function drawProgress() {
      if (
        progressPositionMs === null ||
        progressDurationMs <= 0
      ) {
        return;
      }

      const elapsed = Math.max(
        0,
        Math.min(progressPositionMs, progressDurationMs)
      );

      const percent = (elapsed / progressDurationMs) * 100;

      document.getElementById('progress-section').style.display =
        'block';

      document.getElementById('progress-fill').style.width =
        `${percent}%`;

      document.getElementById('elapsed-time').textContent =
        formatDuration(elapsed);

      document.getElementById('total-time').textContent =
        formatDuration(progressDurationMs);

      document.getElementById('progress-track')
        .setAttribute('aria-valuenow', percent.toFixed(1));
    }

    function animateProgress(now) {
      if (progressClockMs !== null &&
          progressPositionMs !== null &&
          progressDurationMs > 0 &&
          playbackState === 'playing') {
        // Advance with the browser's monotonic clock at exactly 1x.
        // Server samples never accelerate or decelerate the bar.
        const delta = Math.max(0, now - progressClockMs);
        progressPositionMs = Math.min(
          progressDurationMs,
          progressPositionMs + delta
        );
        drawProgress();
      }

      progressClockMs = now;
      requestAnimationFrame(animateProgress);
    }

    function freezeProgress() {
      progressClockMs = null;
    }

    function clearTrack() {
      const artwork = document.getElementById('artwork');

      artwork.style.display = 'none';
      artwork.removeAttribute('src');
      delete artwork.dataset.cover;

      document.getElementById('backdrop').style.backgroundImage =
        'none';

      document.getElementById('track').textContent =
        'No AirPlay connection';

      document.getElementById('artist').textContent = '';
      document.getElementById('album').textContent = '';

      document.getElementById('duration').textContent = 'Unknown';
      document.getElementById('source-format').textContent = 'Unknown';
      document.getElementById('output-format').textContent = 'Unknown';

      clearProgress();
    }

    async function updatePlayer() {
      if (updating) {
        return;
      }

      updating = true;

      try {
        const response = await fetch('/api/airplay', {
          cache: 'no-store'
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const player = await response.json();

        // Metadata may be cached. Progress state takes priority
        // once a valid timing sample has arrived.
        if (progressPositionMs === null) {
          playbackState = player.state;
          setPlaybackStatus(playbackState);
        }

        if (!player.connected) {
          // Retain artwork, track information and progress.
          playbackState = player.state === 'unavailable'
            ? 'unavailable'
            : 'disconnected';

          setPlaybackStatus(playbackState);
          freezeProgress();

          if (currentTrackKey === null) {
            document.getElementById('track').textContent =
              'No AirPlay connection';
          }

          return;
        }

        const trackKey = JSON.stringify([
          player.title,
          player.artist,
          player.album,
          player.duration_ms,
          player.cover_url
        ]);

        if (trackKey !== currentTrackKey) {
          currentTrackKey = trackKey;
          clearProgress();
        }

        const artwork = document.getElementById('artwork');

        if (player.cover_url) {
          if (artwork.dataset.cover !== player.cover_url) {
            artwork.src =
              `/api/artwork?cover=${encodeURIComponent(player.cover_url)}`;

            artwork.dataset.cover = player.cover_url;

            document.getElementById('backdrop').style.backgroundImage =
              `url("${artwork.src}")`;
          }

          artwork.style.display = 'block';
        } else {
          artwork.style.display = 'none';
          artwork.removeAttribute('src');
          delete artwork.dataset.cover;

          document.getElementById('backdrop').style.backgroundImage =
            'none';
        }

        document.getElementById('track').textContent =
          player.title ?? 'No track information';

        document.getElementById('artist').textContent =
          player.artist ?? '';

        document.getElementById('album').textContent =
          player.album ?? '';

        document.getElementById('duration').textContent =
          formatDuration(player.duration_ms);

        document.getElementById('source-format').textContent =
          player.source_format ?? 'Unknown';

        document.getElementById('output-format').textContent =
          player.output_format ?? 'Unknown';

        if (
          player.state === 'playing' ||
          player.state === 'paused'
        ) {
          try {
            const progressResponse = await fetch('/api/progress', {
              cache: 'no-store'
            });

            if (!progressResponse.ok) {
              throw new Error(`HTTP ${progressResponse.status}`);
            }

            const progress = await progressResponse.json();

            if (
              progress.available &&
              Number(progress.duration_ms) ===
                Number(player.duration_ms)
            ) {
              playbackState = progress.state;
              setPlaybackStatus(playbackState);

              const elapsed = Number(progress.elapsed_ms);
              const duration = Number(progress.duration_ms);

              if (
                Number.isFinite(elapsed) &&
                Number.isFinite(duration) &&
                duration > 0
              ) {
                const target = Math.max(
                  0,
                  Math.min(elapsed, duration)
                );

                progressDurationMs = duration;
                // Use the server to initialise a track, to freeze on pause,
                // or to recognise a genuine seek. Routine polls do not
                // alter the running browser clock or its speed.
                if (progressPositionMs === null || playbackState === 'paused') {
                  progressPositionMs = target;
                } else if (Math.abs(target - progressPositionMs) > 8000) {
                  // A large discrepancy is probably a seek or a stale
                  // stream reset, not ordinary network jitter.
                  progressPositionMs = target;
                }

                if (progressClockMs === null) {
                  progressClockMs = performance.now();
                }
                drawProgress();
              } else {
                playbackState = 'unknown';
                setPlaybackStatus(playbackState);
                freezeProgress();
              }
            } else {
              playbackState = 'unknown';
              setPlaybackStatus(playbackState);
              freezeProgress();
            }
          } catch (error) {
            playbackState = 'unknown';
            setPlaybackStatus(playbackState);
            freezeProgress();

            console.error('Progress update failed:', error);
          }
        } else {
          playbackState = player.state;
          setPlaybackStatus(playbackState);
          freezeProgress();
        }
      } catch (error) {
        playbackState = 'unavailable';
        setPlaybackStatus(playbackState);
        freezeProgress();

        if (currentTrackKey === null) {
          document.getElementById('track').textContent =
            'Cannot reach Apple Music Bridge';
        }

        console.error('AirPlay update failed:', error);
      } finally {
        updating = false;
      }
    }

    requestAnimationFrame(animateProgress);
    updatePlayer();
    setInterval(updatePlayer, 3000);

    // v0.9: Full-screen control. Playback logic above is unchanged.
    const fullscreenButton = document.getElementById('fullscreen-button');

    fullscreenButton.addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await document.documentElement.requestFullscreen();
        }
      } catch (error) {
        console.error('Full-screen request failed:', error);
      }
    });

    document.addEventListener('fullscreenchange', () => {
      const active = Boolean(document.fullscreenElement);
      fullscreenButton.textContent = active ? '⤢' : '⛶';
      fullscreenButton.setAttribute(
        'aria-label', active ? 'Exit full screen' : 'Enter full screen'
      );
      fullscreenButton.title = active ? 'Exit full screen' : 'Enter full screen';
    });
  </script>
</body>
</html>
